<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1120">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none';">
  <title>BrasilCord — Em manutenção</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0c1120;color:#f8fafc}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 10%,rgba(21,128,61,.16),transparent 45%),radial-gradient(ellipse at 85% 80%,rgba(37,99,235,.13),transparent 45%),#0c1120}
    main{width:min(100%,500px);text-align:center;padding:54px 36px;border:1px solid rgba(255,255,255,.11);border-radius:24px;background:rgba(20,27,43,.92);box-shadow:0 24px 80px rgba(0,0,0,.27)}
    .symbol{width:78px;height:78px;margin:0 auto 22px;display:grid;place-items:center;border-radius:21px;font-size:40px;background:linear-gradient(145deg,rgba(34,197,94,.22),rgba(59,130,246,.19))}
    .brand{margin:0 0 24px;letter-spacing:.16em;text-transform:uppercase;color:#86efac;font-size:12px;font-weight:800}
    h1{margin:0 0 16px;font-size:clamp(28px,5vw,38px);line-height:1.14;letter-spacing:-.035em}
    p{margin:0 auto 29px;max-width:365px;line-height:1.65;font-size:16px;color:#bac5d7}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;width:100%;max-width:320px;border-radius:13px;background:linear-gradient(110deg,#16a34a,#15803d);color:#fff;font-weight:750;text-decoration:none;transition:filter .2s,transform .2s}
    a:hover{filter:brightness(1.12);transform:translateY(-1px)}
    a:focus-visible{outline:3px solid #93c5fd;outline-offset:4px}
    .foot{display:block;margin-top:24px;font-size:12px;color:#8894a8}
    @media(max-width:420px){main{padding:44px 24px}}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <div class="symbol" aria-hidden="true">🛠️</div>
    <div class="brand">BrasilCord</div>
    <h1 id="maintenance-title">Estamos em manutenção!</h1>
    <p>Entre em nosso Discord para acompanhar as novidades e saber quando voltaremos.</p>
    <a href="https://discord.gg/KgJg3qnj3r" target="_blank" rel="noopener noreferrer">Entrar no nosso Discord</a>
    <small class="foot">Agradecemos pela compreensão.</small>
  </main>
</body>
</html>
